services:
  - type: web
    name: baredo-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://baredo-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: baredo-db
          property: connectionString

  - type: web
    name: baredo-web
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: Dockerfile
    envVars:
      - key: API_BASE_URL
        value: https://baredo-api.onrender.com

databases:
  - name: baredo-db
    plan: free
    databaseName: baredo
    user: baredo
