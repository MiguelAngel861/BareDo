services:
  - type: web
    name: baredo-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://baredo.onrender.com
      - key: DATABASE_URL
        sync: false

  - type: web
    runtime: static
    name: baredo
    plan: free
    rootDir: frontend
    buildCommand: corepack enable && pnpm install && pnpm build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://baredo-api.onrender.com/api/v1
