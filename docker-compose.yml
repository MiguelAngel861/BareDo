services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV}
      PORT: 5000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-baredo}:${POSTGRES_PASSWORD:-baredo}@db:5432/${POSTGRES_DB:-baredo}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
