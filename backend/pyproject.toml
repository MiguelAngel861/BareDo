[project]
name = "BareDo"
version = "1.3.0"
description = "Backend de la to-do web app BareDo escrita en Flask"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "flask-sqlalchemy-lite>=0.2.1",
    "flask-jwt-extended>=4.7.4",
    "flask-limiter>=4.1.1",
    "flask-cors>=5.0.0",
    "gunicorn>=23.0.0",
    "flask-alembic>=3.2.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "flask-openapi4>=0.1.3",
    "pydantic>=2.13.5",
    "flask-openapi3-swagger>=5.31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
fixable = ["E", "F", "I", "B", "UP"]

