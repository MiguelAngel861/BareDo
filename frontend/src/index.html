<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>BareDo - Task Manager</title>
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/tasks.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <header class="site-header">
        <div class="header-inner">
            <h1 class="site-title">BareDo</h1>
            <div id="auth-section" class="auth-minimal">
                <span id="auth-status" aria-live="polite"></span>
                <button id="logout-btn" type="button" class="btn ghost hidden">Logout</button>
            </div>
        </div>
    </header>

    <main id="main">
        <section id="task-list-section" class="section section--list">
            <header class="section-header section-header--minimal">
                <div class="section-header-left">
                    <h2>Tasks</h2>
                    <span id="task-count" class="task-count" aria-live="polite">0 tasks</span>
                </div>
                <button type="button" id="open-create-task-btn" class="btn-create-task">+ CREATE TASK</button>
            </header>

            <div id="filters-bar" class="filters-bar" role="search" aria-label="Task filters">
                <div class="filter-group">
                    <label for="search-title" class="visually-hidden">Search Title</label>
                    <input type="search" id="search-title" placeholder="Search tasks...">
                </div>
                <div class="filter-group">
                    <label for="filter-completed" class="visually-hidden">Filter by status</label>
                    <div class="custom-dropdown" id="filter-completed" role="listbox" aria-expanded="false" aria-haspopup="listbox" tabindex="0" data-value="">
                        <div class="dropdown-trigger">
                            <span class="dropdown-value">All</span>
                            <span class="dropdown-icon">▼</span>
                        </div>
                        <div class="dropdown-options">
                            <div class="dropdown-option selected" data-value="" role="option" aria-selected="true">All</div>
                            <div class="dropdown-option" data-value="true" role="option" aria-selected="false">Completed</div>
                            <div class="dropdown-option" data-value="false" role="option" aria-selected="false">Pending</div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="toast-container"></div>
            <ul id="task-list" class="task-list" role="list"></ul>
            <div id="empty-message" class="empty-state hidden">
                <span class="empty-state-tag">STATUS: 0 TASKS</span>
                <h3 class="empty-state-title">NO TASKS FOUND</h3>
                <p class="empty-state-desc">Create your first task using the "+ CREATE TASK" button above to initialize your workspace.</p>
            </div>
            <nav id="pagination" class="pagination" aria-label="Pagination">
                <button type="button" id="prev-page" disabled>Previous</button>
                <span id="page-indicator">Page 1</span>
                <button type="button" id="next-page" disabled>Next</button>
            </nav>
        </section>
    </main>

    <!-- Pop-out Modal Overlay para Creación y Edición de Tareas -->
    <div id="task-popout-overlay" class="popout-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="form-modal-title">
        <div class="popout-container">
            <header class="popout-header">
                <h2 id="form-modal-title">Create Task</h2>
                <button type="button" id="close-popout-btn" class="btn-close" aria-label="Close modal">ESC / CLOSE</button>
            </header>
            <form id="task-form" class="task-form">
                <input type="hidden" id="task-id" name="task_id">
                <div class="form-group">
                    <label for="title">Title <span class="required">*</span></label>
                    <input type="text" id="title" name="title" required maxlength="40" placeholder="Task title (max 40 chars)">
                    <span class="error-message" id="title-error"></span>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" maxlength="200" placeholder="Task description (max 200 chars)"></textarea>
                    <span class="error-message" id="description-error"></span>
                </div>
                <div class="form-group">
                    <label for="due_date">Due Date</label>
                    <input type="date" id="due_date" name="due_date">
                    <span class="error-message" id="due_date-error"></span>
                </div>
                <div class="form-group">
                    <label class="checkbox-label" for="completed">
                        <input type="checkbox" id="completed" name="completed" class="checkbox-input">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Completed</span>
                    </label>
                </div>
                <button type="submit" id="submit-btn">Create Task</button>
                <button type="button" id="cancel-edit-btn" class="secondary">Cancel</button>
            </form>
            <div id="form-error" class="error-message"></div>
        </div>
    </div>

    <script type="module" src="/app/entries/main.ts"></script>
</body>
</html>
