name: Continuous Integration (backend & frontend)

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRONTEND_DIR: frontend
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '22'

jobs:
  changes:
    name: Detect changed directories
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - '${{ env.FRONTEND_DIR }}/**'
              - '.github/workflows/ci.yml'

  backend-lint:
    name: Backend - Ruff (lint & format)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies (uv sync --frozen)
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check

  backend-test:
    name: Backend - Pytest (tests & coverage)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies (uv sync --frozen)
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest

  frontend-lint:
    name: Frontend - Biome (lint)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ env.FRONTEND_DIR }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/pnpm-lock.yaml'
      - name: Install dependencies (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm lint

  frontend-test:
    name: Frontend - TypeScript & Vitest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ env.FRONTEND_DIR }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/pnpm-lock.yaml'
      - name: Install dependencies (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc)
        run: pnpm typecheck
      - name: Tests (Vitest)
        run: pnpm test:run

  frontend-build:
    name: Frontend - Vite production build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ env.FRONTEND_DIR }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: '${{ env.FRONTEND_DIR }}/pnpm-lock.yaml'
      - name: Install dependencies (pnpm install --frozen-lockfile)
        run: pnpm install --frozen-lockfile
      - name: Production build (Vite)
        run: pnpm build
