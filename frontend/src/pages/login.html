<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>BareDo - Login</title>
    <script src="../env.js"></script>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <h1>Login</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required minlength="3" maxlength="50" autocomplete="username" placeholder="Enter your username">
                    <span class="error-message" id="username-error"></span>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="Enter your password">
                    <span class="error-message" id="password-error"></span>
                </div>
                <div id="global-error" class="global-error"></div>
                <button type="submit" id="submit-btn">Login</button>
            </form>
            <div class="switch-link">
                Don't have an account? <a href="register.html">Register</a>
            </div>
        </div>
    </div>

    <script type="module" src="../js/pages/login.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("../sw.js", { scope: "/" }).catch(function () {});
            });
        }
    </script>
</body>
</html>
