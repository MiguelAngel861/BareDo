[project]
name = "BareDo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.2",
    "flask-sqlalchemy-lite>=0.2.1",
    "flask-jwt-extended>=4.7.4",
    "flask-limiter>=4.1.1",
    "flask-cors>=5.0.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.12.5",
    "flask-alembic>=3.2.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "ruff>=0.14.13",
    "pytest>=8.0",
    "pytest-flask>=1.3",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
select = ["E", "F", "I", "B", "UP"]
fixable = ["E", "F", "I", "B", "UP"]

