services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baredo
      POSTGRES_PASSWORD: baredo
      POSTGRES_DB: baredo
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baredo -d baredo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://baredo:baredo@db:5432/baredo
      SECRET_KEY: dev-secret-change-in-production
      JWT_SECRET_KEY: dev-jwt-secret-change-in-production
      CORS_ORIGINS: http://localhost:8080,http://localhost:5500,http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/wsgi.py:/app/wsgi.py
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - flask --app wsgi:app db upgrade head && flask --app wsgi:app run --host 0.0.0.0 --port 5000

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    environment:
      PORT: 80
      API_UPSTREAM: api:5000
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db_data:
